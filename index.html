<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="トラックバイアス">
<title>トラックバイアス予想</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117; --surface:#1a1d27; --surface2:#252836; --accent:#10b981;
  --text:#f1f5f9; --text-muted:#94a3b8; --border:#2d3148;
  --red:#ef4444; --blue:#3b82f6; --yellow:#f59e0b; --purple:#8b5cf6; --gray:#6b7280;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  background:var(--bg); color:var(--text); height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.header{
  height:56px; background:var(--surface); display:flex; align-items:center;
  padding:0 16px; border-bottom:1px solid var(--border); gap:10px; flex-shrink:0;
}
.header-title{font-size:17px;font-weight:700;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.header-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.icon-btn{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:6px}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}
.tabs{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;background:none;border:none;color:var(--text-muted);font-size:10px;cursor:pointer}
.tab.active{color:var(--accent)}
.tab-icon{font-size:20px}
.card{background:var(--surface);border-radius:14px;margin:12px 16px;overflow:hidden}
.section-label{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.8px;padding:16px 16px 6px;text-transform:uppercase}
.picker-row{display:flex;gap:8px;padding:12px 16px 4px}
select,input[type="date"],input[type="text"],input[type="number"],textarea,select.mini{
  background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; font-size:14px; width:100%;
}
textarea{resize:vertical;min-height:110px;font-family:monospace;font-size:12px}
.btn-primary{background:var(--accent);color:#04140f;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn-danger{background:none;color:var(--red);border:1px solid var(--red);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn-row{display:flex;gap:8px;padding:0 16px}
.btn-row>*{flex:1}
.btn-small{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.btn-small.on{background:var(--accent);color:#04140f;border-color:var(--accent)}
.field{padding:8px 16px}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px}
.subtabs{display:flex;gap:6px;padding:12px 16px 4px}
.subtabs .btn-small{flex:1;text-align:center;padding:9px 0}
.empty{padding:60px 24px;text-align:center;color:var(--text-muted)}
.empty-icon{font-size:40px;margin-bottom:10px}
.headline{margin:12px 16px;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--border)}
.headline-title{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.headline-main{font-size:20px;font-weight:800;line-height:1.4}
.headline-note{font-size:12px;color:var(--text-muted);margin-top:8px}
.bias-group{padding:10px 16px}
.bias-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bias-label{width:64px;font-size:13px;font-weight:600;flex-shrink:0}
.bias-bar-wrap{flex:1;background:var(--surface2);border-radius:6px;height:20px;overflow:hidden;position:relative}
.bias-bar{height:100%;border-radius:6px;transition:width .3s}
.bias-num{width:96px;text-align:right;font-size:12px;color:var(--text-muted);flex-shrink:0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
.badge.up{background:rgba(16,185,129,.18);color:var(--accent)}
.badge.down{background:rgba(239,68,68,.18);color:var(--red)}
.badge.flat{background:rgba(107,114,128,.25);color:var(--text-muted)}
.race-item{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px}
.race-item:last-child{border-bottom:none}
.race-no{width:34px;height:34px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.race-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.race-name{font-size:14px;font-weight:600}
.chev{color:var(--text-muted);font-size:12px}
.horse-table{padding:0 16px 12px}
.horse-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--border)}
.horse-row:last-child{border-bottom:none}
.waku-chip{width:22px;height:22px;border-radius:5px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.finish-chip{width:26px;text-align:center;font-weight:700;flex-shrink:0}
.finish-chip.f1{color:var(--yellow)}
.finish-chip.f2{color:#cbd5e1}
.finish-chip.f3{color:#d97757}
.style-chip{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--text-muted);flex-shrink:0}
.horse-name-cell{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-x{color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:100}
.modal-overlay.hidden{display:none}
.modal-sheet{background:var(--bg);width:100%;max-height:88vh;border-radius:18px 18px 0 0;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.modal-head{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}
.modal-title{flex:1;font-size:16px;font-weight:700}
.hint{font-size:12px;color:var(--text-muted);padding:0 16px;line-height:1.6}
.hrow-grid{display:grid;grid-template-columns:38px 44px 1fr 40px 62px 24px;gap:6px;align-items:center;padding:6px 16px}
.hrow-grid input{padding:6px 4px;font-size:12px;text-align:center;border-radius:6px}
.hrow-grid input.name{text-align:left}
.hrow-head{display:grid;grid-template-columns:38px 44px 1fr 40px 62px 24px;gap:6px;padding:0 16px 4px;font-size:10px;color:var(--text-muted)}
footer.sp{height:24px}
.link-btn{color:var(--accent);background:none;border:none;font-size:13px;cursor:pointer;padding:8px 0}
</style>
</head>
<body>

<div class="header">
  <div style="flex:1">
    <div class="header-title" id="headerTitle">トラックバイアス予想</div>
    <div class="header-sub" id="headerSub"></div>
  </div>
  <button class="icon-btn" onclick="openSettingsModal()">⚙️</button>
  <button class="icon-btn" onclick="openInfoModal()">❓</button>
</div>

<div class="main">
  <div class="view active" id="view-today"></div>
  <div class="view" id="view-history"></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="today" onclick="switchTab('today')">
    <span class="tab-icon">📊</span><span>本日のバイアス</span>
  </button>
  <button class="tab" data-tab="history" onclick="switchTab('history')">
    <span class="tab-icon">🗂</span><span>履歴</span>
  </button>
</div>

<div class="modal-overlay hidden" id="modal" onclick="onModalBg(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  Storage
// ══════════════════════════════════════════
const STORAGE_KEY = 'trackBiasDB_v1';
const VENUES = ['東京','中山','阪神','京都','中京','小倉','新潟','福島','札幌','函館','その他'];
const VENUE_CODE = {'01':'札幌','02':'函館','03':'福島','04':'新潟','05':'東京','06':'中山','07':'中京','08':'京都','09':'阪神','10':'小倉'};

function extractRaceId(url){
  const m = (url||'').match(/(\d{12})/);
  return m ? m[1] : null;
}
function decomposeRaceId(id){
  if(!id || id.length !== 12) return null;
  const year = id.slice(0,4);
  const venueCode = id.slice(4,6);
  const kai = id.slice(6,8);
  const day = id.slice(8,10);
  const raceNo = parseInt(id.slice(10,12), 10);
  if(!raceNo) return null;
  return { year, venueCode, kai, day, raceNo, venueName: VENUE_CODE[venueCode] || null };
}
function buildRaceId(parts, raceNo){
  return `${parts.year}${parts.venueCode}${parts.kai}${parts.day}${String(raceNo).padStart(2,'0')}`;
}
function dbUrlForRaceId(id){ return `https://db.netkeiba.com/race/${id}/`; }

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { sessions: {}, lastKey: null };
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

let db = loadDB();
let currentKey = null;
let activeTab = 'today';
let expandedRaceNo = null;
let formCtx = {};
let bulkCtx = {};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function sessionKey(date, venue){ return `${date}__${venue}`; }
function getSession(key){ return db.sessions[key]; }
function ensureSession(date, venue){
  const key = sessionKey(date, venue);
  if(!db.sessions[key]){
    db.sessions[key] = { date, venue, races: [] };
  }
  return key;
}

// ══════════════════════════════════════════
//  Init
// ══════════════════════════════════════════
function init(){
  currentKey = db.lastKey && db.sessions[db.lastKey] ? db.lastKey : null;
  if(!currentKey){
    currentKey = ensureSession(todayStr(), VENUES[0]);
    db.lastKey = currentKey; saveDB();
  }
  switchTab('today');
}

function switchTab(t){
  activeTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  document.getElementById('view-today').classList.toggle('active', t === 'today');
  document.getElementById('view-history').classList.toggle('active', t === 'history');
  if(t === 'today') renderToday();
  else renderHistory();
}

// ══════════════════════════════════════════
//  Bias calculation
// ══════════════════════════════════════════
function wakuGroup(waku){
  if(waku == null) return null;
  if(waku <= 2) return '内枠';
  if(waku <= 6) return '中枠';
  return '外枠';
}
function styleGroup(corners, fieldSize){
  if(!corners || !corners.length || !fieldSize) return null;
  const c0 = corners[0];
  if(!c0 || isNaN(c0)) return null;
  if(c0 === 1) return '逃げ';
  const ratio = c0 / fieldSize;
  if(ratio <= 0.35) return '先行';
  if(ratio <= 0.65) return '差し';
  return '追込';
}
function computeBias(session){
  const wakuStats = {}; const styleStats = {};
  let totalN = 0, totalWin = 0, totalTop3 = 0;
  (session.races||[]).forEach(r => {
    const field = (r.horses||[]).length;
    (r.horses||[]).forEach(h => {
      if(h.finish == null) return;
      totalN++;
      const isWin = h.finish === 1;
      const isTop3 = h.finish >= 1 && h.finish <= 3;
      if(isWin) totalWin++;
      if(isTop3) totalTop3++;
      const wg = wakuGroup(h.waku);
      if(wg){
        wakuStats[wg] = wakuStats[wg] || {n:0,win:0,top3:0};
        wakuStats[wg].n++; if(isWin) wakuStats[wg].win++; if(isTop3) wakuStats[wg].top3++;
      }
      const sg = styleGroup(h.corners, field);
      if(sg){
        styleStats[sg] = styleStats[sg] || {n:0,win:0,top3:0};
        styleStats[sg].n++; if(isWin) styleStats[sg].win++; if(isTop3) styleStats[sg].top3++;
      }
    });
  });
  const baseTop3 = totalN ? totalTop3/totalN : 0;
  const baseWin = totalN ? totalWin/totalN : 0;
  return { wakuStats, styleStats, baseTop3, baseWin, totalN, raceCount: (session.races||[]).length };
}
function verdictFor(stat, baseTop3){
  if(!stat || stat.n < 3) return {tag:'flat', label:'判定不可', diff:0};
  const rate = stat.top3/stat.n;
  const diff = rate - baseTop3;
  if(diff >= 0.12) return {tag:'up', label:'有利', diff};
  if(diff <= -0.12) return {tag:'down', label:'不利', diff};
  return {tag:'flat', label:'普通', diff};
}
function headline(bias){
  if(bias.raceCount < 2){
    return { text:'データが少ないため判定できません', note:'レース結果を2件以上取り込むと傾向が表示されます。' };
  }
  const order = ['内枠','中枠','外枠'];
  const wCands = order.map(g => ({g, v: verdictFor(bias.wakuStats[g], bias.baseTop3)}))
                       .filter(x => x.v.tag !== 'flat');
  const sOrder = ['逃げ','先行','差し','追込'];
  const sCands = sOrder.map(g => ({g, v: verdictFor(bias.styleStats[g], bias.baseTop3)}))
                        .filter(x => x.v.tag !== 'flat');
  const parts = [];
  if(wCands.length){
    wCands.sort((a,b)=>Math.abs(b.v.diff)-Math.abs(a.v.diff));
    const top = wCands[0];
    parts.push(`${top.g}${top.v.label}`);
  }
  if(sCands.length){
    sCands.sort((a,b)=>Math.abs(b.v.diff)-Math.abs(a.v.diff));
    const top = sCands[0];
    parts.push(`${top.g}${top.v.label}`);
  }
  if(!parts.length) return { text:'フラットな馬場（明確な傾向なし）', note:`全${bias.raceCount}レース・${bias.totalN}頭のデータに基づく` };
  return { text: parts.join(' / '), note:`全${bias.raceCount}レース・${bias.totalN}頭のデータに基づく（参考値）` };
}

// ══════════════════════════════════════════
//  Render: Today
// ══════════════════════════════════════════
function renderToday(){
  const session = getSession(currentKey);
  document.getElementById('headerTitle').textContent = 'トラックバイアス予想';
  document.getElementById('headerSub').textContent = session ? `${session.date} · ${session.venue}` : '';

  const el = document.getElementById('view-today');
  const venueOptions = VENUES.map(v => `<option value="${v}" ${session.venue===v?'selected':''}>${v}</option>`).join('');

  const bias = computeBias(session);
  const hl = headline(bias);

  el.innerHTML = `
    <div class="picker-row">
      <select onchange="changeVenue(this.value)">${venueOptions}</select>
      <input type="date" value="${session.date}" onchange="changeDate(this.value)">
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-primary" onclick="openFindRaceModal()">📅 日付・開催場からレースを探す</button>
    </div>
    <div class="btn-row" style="margin-top:6px;gap:16px">
      <button class="link-btn" style="width:100%;text-align:center" onclick="openBulkFetchModal()">レースURLを直接指定</button>
      <button class="link-btn" style="width:100%;text-align:center" onclick="openAddRaceModal()">個別に追加・修正</button>
    </div>

    <div class="headline">
      <div class="headline-title">本日の傾向（${session.venue}）</div>
      <div class="headline-main">${esc(hl.text)}</div>
      <div class="headline-note">${esc(hl.note)}</div>
    </div>

    ${bias.totalN ? renderBiasCards(bias) : ''}

    <div class="section-label">取り込んだレース（${(session.races||[]).length}）</div>
    <div class="card">
      ${(session.races||[]).length ? renderRaceList(session) : `<div class="empty" style="padding:32px"><div class="empty-icon">🏁</div><div>レース結果を追加してください</div></div>`}
    </div>
    <footer class="sp"></footer>
  `;
}

function barColor(tag){
  return tag === 'up' ? 'var(--accent)' : tag === 'down' ? 'var(--red)' : 'var(--gray)';
}
function renderBiasCards(bias){
  const wakuOrder = ['内枠','中枠','外枠'];
  const styleOrder = ['逃げ','先行','差し','追込'];
  const rowsHtml = (order, stats) => order.map(g => {
    const s = stats[g];
    if(!s) return '';
    const v = verdictFor(s, bias.baseTop3);
    const rate = Math.round((s.top3/s.n)*100);
    return `
      <div class="bias-row">
        <div class="bias-label">${g}<span class="badge ${v.tag}">${v.label}</span></div>
        <div class="bias-bar-wrap"><div class="bias-bar" style="width:${Math.min(rate,100)}%;background:${barColor(v.tag)}"></div></div>
        <div class="bias-num">複3率${rate}%（n=${s.n}）</div>
      </div>`;
  }).join('');

  return `
    <div class="section-label">枠番バイアス</div>
    <div class="card"><div class="bias-group">${rowsHtml(wakuOrder, bias.wakuStats) || '<div class="hint" style="padding:12px 0">枠番データがありません</div>'}</div></div>
    <div class="section-label">脚質バイアス</div>
    <div class="card"><div class="bias-group">${rowsHtml(styleOrder, bias.styleStats) || '<div class="hint" style="padding:12px 0">通過順位データがありません</div>'}</div></div>
  `;
}

function renderRaceList(session){
  return session.races.slice().sort((a,b)=>(a.raceNo||0)-(b.raceNo||0)).map(r => {
    const field = (r.horses||[]).length;
    const expanded = expandedRaceNo === r.raceNo;
    const metaStr = [r.surface, r.distance ? r.distance+'m' : null, r.condition].filter(Boolean).join(' · ');
    return `
      <div class="race-item" onclick="toggleRace(${r.raceNo})">
        <div class="race-no">${r.raceNo!=null?r.raceNo+'R':'?'}</div>
        <div style="flex:1">
          <div class="race-name">${metaStr || 'レース情報未設定'}</div>
          <div class="race-meta">${field}頭立て</div>
        </div>
        <span class="del-x" onclick="event.stopPropagation();deleteRace(${r.raceNo})">🗑</span>
        <span class="chev">${expanded?'▲':'▼'}</span>
      </div>
      ${expanded ? renderHorseTable(r) : ''}
    `;
  }).join('');
}
function renderHorseTable(r){
  const field = (r.horses||[]).length;
  const sorted = [...(r.horses||[])].sort((a,b)=>(a.finish||99)-(b.finish||99));
  return `<div class="horse-table">
    ${sorted.map(h => {
      const fc = h.finish===1?'f1':h.finish===2?'f2':h.finish===3?'f3':'';
      const sg = styleGroup(h.corners, field);
      return `<div class="horse-row">
        <span class="finish-chip ${fc}">${h.finish!=null?h.finish+'着':'-'}</span>
        <span class="waku-chip">${h.waku!=null?h.waku:'?'}</span>
        <span class="horse-name-cell">${esc(h.name)||(h.umaban!=null?'馬番'+h.umaban:'')}</span>
        ${sg?`<span class="style-chip">${sg}</span>`:''}
        <span class="horse-meta" style="color:var(--text-muted)">${h.corners&&h.corners.length?h.corners.join('-'):''}</span>
      </div>`;
    }).join('')}
  </div>`;
}
function toggleRace(no){ expandedRaceNo = expandedRaceNo === no ? null : no; renderToday(); }
function deleteRace(no){
  if(!confirm(`${no}Rのデータを削除しますか？`)) return;
  const session = getSession(currentKey);
  session.races = session.races.filter(r => r.raceNo !== no);
  saveDB(); renderToday();
}

function changeVenue(v){
  const session = getSession(currentKey);
  const key = ensureSession(session.date, v);
  currentKey = key; db.lastKey = key; saveDB();
  expandedRaceNo = null;
  renderToday();
}
function changeDate(d){
  const session = getSession(currentKey);
  const key = ensureSession(d, session.venue);
  currentKey = key; db.lastKey = key; saveDB();
  expandedRaceNo = null;
  renderToday();
}

// ══════════════════════════════════════════
//  Render: History
// ══════════════════════════════════════════
function renderHistory(){
  const el = document.getElementById('view-history');
  document.getElementById('headerTitle').textContent = '履歴';
  document.getElementById('headerSub').textContent = '';
  const keys = Object.keys(db.sessions)
    .filter(k => (db.sessions[k].races||[]).length)
    .sort((a,b) => db.sessions[b].date.localeCompare(db.sessions[a].date));
  el.innerHTML = `
    <div class="section-label">保存済みの開催日</div>
    <div class="card">
      ${keys.length ? keys.map(k => {
        const s = db.sessions[k];
        const bias = computeBias(s);
        const hl = headline(bias);
        return `<div class="race-item" onclick="openHistorySession('${k}')">
          <div style="flex:1">
            <div class="race-name">${s.date} · ${s.venue}</div>
            <div class="race-meta">${s.races.length}レース / ${hl.text}</div>
          </div>
          <span class="del-x" onclick="event.stopPropagation();deleteSession('${k}')">🗑</span>
          <span class="chev">▶</span>
        </div>`;
      }).join('') : `<div class="empty"><div class="empty-icon">🗂</div><div>保存されたデータはまだありません</div></div>`}
    </div>
    <footer class="sp"></footer>
  `;
}
function openHistorySession(k){
  currentKey = k; db.lastKey = k; saveDB();
  expandedRaceNo = null;
  switchTab('today');
}
function deleteSession(k){
  if(!confirm('この開催日のデータを削除しますか？')) return;
  delete db.sessions[k];
  if(currentKey === k){
    currentKey = ensureSession(todayStr(), VENUES[0]);
    db.lastKey = currentKey;
  }
  saveDB(); renderHistory();
}

function normText(s){ return (s||'').replace(/[\s　]+/g,''); }

function parseResultHTML(raw){
  let doc;
  try{ doc = new DOMParser().parseFromString(raw, 'text/html'); }
  catch(e){ doc = null; }
  let horses = [];
  if(doc){
    const tables = [...doc.querySelectorAll('table')];
    for(const t of tables){
      const trs = [...t.querySelectorAll('tr')];
      if(!trs.length) continue;
      const headerCells = [...trs[0].querySelectorAll('th,td')].map(c => normText(c.textContent));
      const hasUmaban = headerCells.some(h => h.includes('馬番'));
      const hasFinish = headerCells.some(h => h.includes('着順') || h === '着');
      if(!hasUmaban || !hasFinish) continue;
      const idx = {};
      headerCells.forEach((h,i) => {
        if(h.includes('枠') && idx.waku==null) idx.waku = i;
        else if(h.includes('馬番') && idx.umaban==null) idx.umaban = i;
        else if(h.includes('馬名') && idx.name==null) idx.name = i;
        else if((h.includes('着')&&h.includes('順')||h==='着') && idx.finish==null) idx.finish = i;
        else if((h.includes('コーナー')||h.includes('通過')) && idx.corner==null) idx.corner = i;
      });
      if(idx.finish==null || idx.umaban==null) continue;
      const rows = trs.slice(1);
      rows.forEach(row => {
        const cells = [...row.querySelectorAll('td,th')];
        if(!cells.length) return;
        const get = k => (idx[k]!=null && cells[idx[k]]) ? normText(cells[idx[k]].textContent) : '';
        const finish = parseInt(get('finish'), 10);
        if(!finish || isNaN(finish)) return;
        const waku = parseInt(get('waku'), 10);
        const umaban = parseInt(get('umaban'), 10);
        const name = idx.name!=null && cells[idx.name] ? cells[idx.name].textContent.trim() : '';
        const cornerStr = get('corner');
        const corners = cornerStr.split(/[-−ー,=]/).map(s => parseInt(s,10)).filter(n => !isNaN(n));
        horses.push({ waku: isNaN(waku)?null:waku, umaban: isNaN(umaban)?null:umaban, name, finish, corners });
      });
      if(horses.length) break;
    }
  }
  const bodyText = normText(doc && doc.body ? doc.body.textContent : raw);
  const raceNoMatch = bodyText.match(/(\d{1,2})R(?![a-zA-Z0-9])/);
  const distMatch = bodyText.match(/(芝|ダ)(\d{3,4})m/);
  const condMatch = bodyText.match(/馬場[:：]?(良|稍重|重|不良)|\((良|稍重|重|不良)\)/);
  const cond = condMatch ? (condMatch[1] || condMatch[2]) : null;
  const dateMatch = bodyText.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  const date = dateMatch ? `${dateMatch[1]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[3]).padStart(2,'0')}` : null;
  return {
    raceNo: raceNoMatch ? parseInt(raceNoMatch[1],10) : null,
    surface: distMatch ? distMatch[1] : null,
    distance: distMatch ? parseInt(distMatch[2],10) : null,
    condition: cond,
    date,
    horses
  };
}

function getProxyBase(){

function setProxyBase(v){ localStorage.setItem('cfProxyBase', (v||'').trim()); }

function extractRaceIdFromHref(href){
  if(!href) return null;
  let m = href.match(/\/race\/(\d{12})\/?/);
  if(m) return m[1];
  m = href.match(/[?&]race_id=(\d{12})/);
  if(m) return m[1];
  return null;
}
function parseDayListHTML(raw){
  let doc;
  try{ doc = new DOMParser().parseFromString(raw, 'text/html'); }
  catch(e){ doc = null; }
  if(!doc) return [];
  const anchors = [...doc.querySelectorAll('a[href]')];
  const seen = new Set();
  const races = [];
  anchors.forEach(a => {
    const id = extractRaceIdFromHref(a.getAttribute('href'));
    if(!id) return;
    if(seen.has(id)) return;
    const parts = decomposeRaceId(id);
    if(!parts) return;
    seen.add(id);
    races.push({ id, parts, label: normText(a.textContent) || '' });
  });
  return races;
}
function dayCardUrl(dateStr){
  const ymd = (dateStr||'').replace(/-/g,'');
  return `https://race.netkeiba.com/top/race_list.html?kaisai_date=${ymd}`;
}

async function fetchWithProxies(url){
  const builders = [];
  const custom = getProxyBase();
  if(custom){
    const base = custom.replace(/\/?$/, '');
    builders.push(u => `${base}?url=${encodeURIComponent(u)}`);
  }
  builders.push(
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
  );
  let lastErr = null;
  for(const build of builders){
    try{
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 12000);
      const res = await fetch(build(url), { signal: controller.signal });
      clearTimeout(t);
      if(res.ok){
        const text = await res.text();
        if(text && text.length > 300) return text;
      }
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('取得失敗');
}

async function fetchFromUrl(){
  const url = document.getElementById('src-url').value.trim();

  if(!url){ statusEl.textContent = 'URLを入力してください'; return; }
  statusEl.textContent = '取得中...';
  try{
    const html = await fetchWithProxies(url);
    const draft = parseResultHTML(html);
    if(!draft.horses.length){
      statusEl.textContent = '取得はできましたが結果テーブルを認識できませんでした。「HTML貼り付け」または「手入力」をお試しください。';

    statusEl.textContent = '取得に失敗しました（サイト側の制限の可能性があります）。「HTML貼り付け」または「手入力」をお試しください。';
  }
}

async function searchDay(){
  const dateInput = document.getElementById('find-date');
  findCtx.date = dateInput.value || findCtx.date;
  findCtx.status = 'loading';
  findCtx.error = null;
  findCtx.groups = {};
  renderFindRaceModal();

  try{
    const html = await fetchWithProxies(dayCardUrl(findCtx.date));
    const races = parseDayListHTML(html);
    if(!races.length){
      findCtx.error = 'この日のレースが見つかりませんでした(開催がない日か、取得に失敗した可能性があります)。中継サーバーの設定(設定アイコン)もご確認ください。';
    } else {
      const groups = {};
      races.forEach(r => {
        const vname = r.parts.venueName || '不明';
        groups[vname] = groups[vname] || [];
        groups[vname].push(r);
      });
      findCtx.groups = groups;
    }
  }catch(e){
    findCtx.error = '取得に失敗しました。中継サーバーの設定(設定アイコン)を確認するか、「代わりにレースURLを直接指定する」をお試しください。';
  }
  findCtx.status = 'idle';
  renderFindRaceModal();
}
function pickFoundRace(id){
  const parts = decomposeRaceId(id);
  if(!parts) return;
  closeModal();
  bulkCtx = { url:'', includeTarget:false, log:[], running:false, done:false, resultSummary:null, failedNos:[], sourceLabel:`${parts.venueName||''} ${parts.raceNo}R` };
  renderBulkFetchModal();
  runBulkFetchForParts(parts, false);
}

// ══════════════════════════════════════════
//  Bulk fetch (specify one race, auto-fetch the rest of the day)
// ══════════════════════════════════════════
function openBulkFetchModal(){
  bulkCtx = { url:'', includeTarget:false, log:[], running:false, done:false, resultSummary:null, failedNos:[] };
  renderBulkFetchModal();
}
function renderBulkFetchModal(){
  openModal(`
    <div class="modal-head"><div class="modal-title">レースを指定して一括取得</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${bulkCtx.sourceLabel ? `
      <div class="hint">対象レース: <b style="color:var(--text)">${esc(bulkCtx.sourceLabel)}</b> — これより前の同日・同競馬場のレースを自動でさかのぼって取得します。</div>
    ` : `
      <div class="hint">分析したいレース（例：本日のメインレース）のnetkeibaレース結果ページURLを入力してください。そのレースより前の同日・同競馬場のレースを自動でさかのぼって取得し、まとめてトラックバイアスを算出します。</div>
      <div class="field"><input type="text" id="bulk-url" placeholder="https://db.netkeiba.com/race/xxxxxxxxxxxx/" value="${esc(bulkCtx.url||'')}" ${bulkCtx.running?'disabled':''}></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="bulk-include" style="width:auto" ${bulkCtx.includeTarget?'checked':''} ${bulkCtx.running?'disabled':''}>
        <label for="bulk-include" style="margin:0;font-size:13px;color:var(--text)">指定したレース自体の結果も含める（確定済みの場合）</label>
      </div>
      <div class="btn-row" style="margin-top:6px"><button class="btn-primary" onclick="startBulkFetch()" ${bulkCtx.running?'disabled':''}>${bulkCtx.running?'取得中...':'取得開始'}</button></div>
    `}
    ${bulkCtx.log.length ? `
      <div class="section-label">取得状況</div>
      <div class="card"><div style="padding:4px 16px">
        ${bulkCtx.log.map(l => `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--border)">
          <span>${esc(l.label)}</span><span style="color:${l.ok===true?'var(--accent)':l.ok===false?'var(--red)':'var(--text-muted)'}">${esc(l.status)}</span>
        </div>`).join('')}
      </div></div>` : ''}
    ${bulkCtx.done ? `
      <div class="hint" style="padding-top:4px">${esc(bulkCtx.resultSummary||'')}</div>
      <div class="btn-row" style="margin-top:10px"><button class="btn-primary" onclick="closeModal();switchTab('today')">バイアスを見る</button></div>
      ${bulkCtx.failedNos.length ? `<div class="btn-row" style="margin-top:8px"><button class="btn-secondary" onclick="openAddRaceModalFor(${bulkCtx.failedNos[0]})">失敗したレースを手動で追加</button></div>` : ''}
    ` : ''}
    <div class="hint" style="padding-top:14px">対応：中央競馬10場（東京・中山・阪神・京都・中京・小倉・新潟・福島・札幌・函館）。サイト側の制限で一部レースの取得に失敗することがあります。その場合は「個別にレースを追加」からHTML貼り付け・手入力で補ってください。</div>
    <footer class="sp"></footer>
  `);
}
function openAddRaceModalFor(raceNo){
  formCtx = { mode:'preview', sub:'manual', draft:{ raceNo, surface:null, distance:null, condition:null, horses:[
    {waku:null,umaban:null,name:'',finish:null,corners:[]}
  ]}};
  renderAddRaceModal();
}
async function startBulkFetch(){
  const urlInput = document.getElementById('bulk-url');
  const includeInput = document.getElementById('bulk-include');
  const url = urlInput.value.trim();
  bulkCtx.url = url;
  bulkCtx.includeTarget = includeInput.checked;

  const id = extractRaceId(url);
  const parts = id ? decomposeRaceId(id) : null;
  if(!parts){
    bulkCtx.log = [{label:'URL', status:'レースIDを認識できませんでした', ok:false}];
    renderBulkFetchModal();
    return;
  }
  await runBulkFetchForParts(parts, bulkCtx.includeTarget);
}
async function runBulkFetchForParts(parts, includeTarget){
  const lastNo = parts.raceNo + (includeTarget ? 0 : -1);
  if(lastNo < 1){
    bulkCtx.log = [{label:`${parts.raceNo}R`, status:'これより前のレースがありません', ok:false}];
    bulkCtx.running = false; bulkCtx.done = true;
    renderBulkFetchModal();
    return;
  }

  bulkCtx.running = true;
  bulkCtx.done = false;
  bulkCtx.log = [];
  bulkCtx._results = [];
  renderBulkFetchModal();

  for(let n = 1; n <= lastNo; n++){
    bulkCtx.log.push({label:`${n}R`, status:'取得中...', ok:null});
    renderBulkFetchModal();
    const raceUrl = dbUrlForRaceId(buildRaceId(parts, n));
    try{
      const html = await fetchWithProxies(raceUrl);
      const draft = parseResultHTML(html);
      if(!draft.horses.length) throw new Error('no-horses');
      draft.raceNo = draft.raceNo || n;
      bulkCtx._results.push(draft);
      bulkCtx.log[bulkCtx.log.length-1] = {label:`${n}R`, status:'✓ 取得成功', ok:true};
    }catch(e){
      bulkCtx.log[bulkCtx.log.length-1] = {label:`${n}R`, status:'× 取得失敗', ok:false};
    }
    renderBulkFetchModal();
    await new Promise(r => setTimeout(r, 400));
  }
  finalizeBulkFetch(parts);
}
function finalizeBulkFetch(parts){
  bulkCtx.running = false;
  bulkCtx.done = true;
  const results = bulkCtx._results || [];
  bulkCtx.failedNos = bulkCtx.log.filter(l => l.ok === false).map(l => parseInt(l.label,10)).filter(n => !isNaN(n));

  if(!results.length){
    bulkCtx.resultSummary = '取得に成功したレースがありませんでした。「個別にレースを追加」のHTML貼り付け・手入力をお試しください。';
    renderBulkFetchModal();
    return;
  }
  const dated = results.find(r => r.date);
  const date = (dated && dated.date) || todayStr();
  const venue = parts.venueName || VENUES[0];
  const key = ensureSession(date, venue);
  const session = getSession(key);
  let savedCount = 0;
  results.forEach(d => {
    const horses = d.horses.filter(h => h.waku!=null && h.finish!=null);
    if(!horses.length) return;
    session.races = (session.races||[]).filter(r => r.raceNo !== d.raceNo);
    session.races.push({ raceNo: d.raceNo, surface: d.surface, distance: d.distance, condition: d.condition, horses });
    savedCount++;
  });
  currentKey = key; db.lastKey = key;
  saveDB();
  const failCount = bulkCtx.failedNos.length;
  bulkCtx.resultSummary = `${date}・${venue} — ${savedCount}/${bulkCtx.log.length}レースを取り込みました。` + (failCount ? `（失敗: ${bulkCtx.failedNos.join('R, ')}R）` : '');
  renderBulkFetchModal();
}

init();
</script>
